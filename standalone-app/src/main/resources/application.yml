server:
  address: 127.0.0.1
  port: 7861

spring:
  application:
    name: waterworks-standalone
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:file:./data/waterworks;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
  sql:
    init:
      mode: always
      encoding: UTF-8
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB
  jackson:
    time-zone: Asia/Shanghai

logging:
  file:
    name: ./logs/waterworks.log
  level:
    root: INFO
    com.yiruantong.standalone: INFO
