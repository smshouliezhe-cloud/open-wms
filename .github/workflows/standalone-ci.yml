name: Standalone App CI

on:
  push:
    branches:
      - standalone-waterworks
    paths:
      - 'standalone-app/**'
      - '.github/workflows/standalone-ci.yml'
  pull_request:
    paths:
      - 'standalone-app/**'
      - '.github/workflows/standalone-ci.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Test and package standalone app
        run: mvn -f standalone-app/pom.xml -B clean test package
      - name: Upload executable jar
        uses: actions/upload-artifact@v4
        with:
          name: waterworks-standalone-jar
          path: standalone-app/target/waterworks-standalone.jar
          if-no-files-found: error
          retention-days: 14

  windows-exe:
    needs: build
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Download executable jar
        uses: actions/download-artifact@v4
        with:
          name: waterworks-standalone-jar
          path: dist/input
      - name: Build embedded Java runtime
        shell: pwsh
        run: |
          $modules = 'java.base,java.compiler,java.datatransfer,java.desktop,java.instrument,java.logging,java.management,java.management.rmi,java.naming,java.net.http,java.prefs,java.rmi,java.scripting,java.security.jgss,java.security.sasl,java.sql,java.sql.rowset,java.transaction.xa,java.xml,java.xml.crypto,jdk.charsets,jdk.crypto.ec,jdk.httpserver,jdk.localedata,jdk.management,jdk.naming.dns,jdk.naming.rmi,jdk.net,jdk.unsupported,jdk.zipfs'
          & "$env:JAVA_HOME\bin\jlink.exe" --add-modules $modules --strip-debug --no-header-files --no-man-pages --compress=2 --output dist/runtime
      - name: Build portable EXE app
        shell: pwsh
        run: |
          & "$env:JAVA_HOME\bin\jpackage.exe" `
            --type app-image `
            --name WaterworksStandalone `
            --app-version 0.1.0 `
            --input dist/input `
            --main-jar waterworks-standalone.jar `
            --runtime-image dist/runtime `
            --dest dist/portable `
            --win-console
      - name: Smoke test portable EXE
        shell: pwsh
        run: |
          $work = (Resolve-Path 'dist/portable/WaterworksStandalone').Path
          $exe = Join-Path $work 'WaterworksStandalone.exe'
          $process = Start-Process -FilePath $exe -WorkingDirectory $work -PassThru
          $ok = $false
          try {
            for ($i = 0; $i -lt 30; $i++) {
              Start-Sleep -Seconds 1
              try {
                $response = Invoke-WebRequest -UseBasicParsing 'http://127.0.0.1:7861/api/inventory' -TimeoutSec 2
                if ($response.StatusCode -eq 200) { $ok = $true; break }
              } catch { }
            }
          } finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
          }
          if (-not $ok) { throw 'Portable EXE smoke test failed: application did not start.' }
          Remove-Item -Recurse -Force (Join-Path $work 'data') -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force (Join-Path $work 'logs') -ErrorAction SilentlyContinue
      - name: Build Windows installer EXE
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/installer | Out-Null
          & "$env:JAVA_HOME\bin\jpackage.exe" `
            --type exe `
            --name WaterworksStandalone `
            --app-version 0.1.0 `
            --vendor 'Waterworks Standalone' `
            --input dist/input `
            --main-jar waterworks-standalone.jar `
            --runtime-image dist/runtime `
            --dest dist/installer `
            --win-dir-chooser `
            --win-menu `
            --win-shortcut `
            --win-console
      - name: Upload portable EXE package
        uses: actions/upload-artifact@v4
        with:
          name: waterworks-standalone-win64-exe-portable
          path: dist/portable/WaterworksStandalone
          if-no-files-found: error
          retention-days: 14
      - name: Upload Windows installer EXE
        uses: actions/upload-artifact@v4
        with:
          name: waterworks-standalone-win64-installer-exe
          path: dist/installer/*.exe
          if-no-files-found: error
          retention-days: 14
